{% extends "base.html" %}

{% block title %}404 — Page Not Found | DevLink{% endblock %}

{% block content %}
<div style="text-align: center; padding: 60px 20px;">
  <h1 style="font-size: 72px; font-weight: 800; color: #3b82f6; margin-bottom: 10px;">404</h1>
  <h2 style="font-size: 24px; font-weight: 600; color: #1f2937; margin-bottom: 16px;">Page Not Found</h2>
  <p style="font-size: 16px; color: #6b7280; max-width: 500px; margin: 0 auto 30px;">
    The page you are looking for does not exist or has been moved.
  </p>
  <a href="{% url 'home' %}" style="display: inline-block; background-color: #2563eb; color: #ffffff; padding: 10px 24px; border-radius: 8px; text-decoration: none; font-weight: 500;">
    Back to Home
  </a>
</div>
{% endblock %}
